<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WikiWander - 3D Wikipedia Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <div id="controls">
        <h1>WikiWander</h1>
        <div class="input-group">
            <input type="text" id="wikiUrl" placeholder="Enter Wikipedia URL or article name (e.g., 'Solar System')">
            <button id="loadBtn">Load Article</button>
        </div>
        <div id="info">
            <p>Current: <span id="currentPage">None</span></p>
            <p>Links loaded: <span id="linkCount">0</span></p>
        </div>
        <div class="instructions">
            <h3>Controls:</h3>
            <ul>
                <li>Drag to rotate view</li>
                <li>Scroll to zoom</li>
                <li>Click blue circles to navigate to links</li>
            </ul>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
